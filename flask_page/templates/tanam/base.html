{# tanam/base.html #}
<!DOCTYPE html>
<html>
<head>
  <title>{{title | safe }}</title>
  {% block head %}
  {% endblock %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='lib/bootstrap.min.css') }}" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: url('/static/images/tanam/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }
    </style>
</head>
<body>
  {% block content %}
    {{ html | safe }}
  {% endblock %}

  {% block script %}
  {% endblock %}
  <script src="{{ url_for('static', filename='lib/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
